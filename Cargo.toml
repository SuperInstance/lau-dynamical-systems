[package]
name = "lau-dynamical-systems"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-dynamical-systems"
description = "Dynamical systems theory: bifurcations, attractors, chaos, and agent behavioral dynamics"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
